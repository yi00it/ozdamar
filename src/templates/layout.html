<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}}</title>
  <meta name="description" content="{{page_description}}">
  <link rel="canonical" href="{{page_url}}">{{head_extra}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site_name}}">
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:description" content="{{page_description}}">
  <meta property="og:url" content="{{page_url}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@yi00it">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{base_path}}/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{base_path}}/apple-touch-icon.png">
  <link rel="manifest" href="{{base_path}}/site.webmanifest">
  <link rel="preload" href="{{base_path}}/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{base_path}}/assets/main.css">
  <link rel="alternate" type="application/rss+xml" title="{{site_name}}" href="{{base_path}}/feed.xml">
  <!-- Hold the first frame until site.js has placed the nav pill, so page transitions can morph it -->
  <link rel="expect" href="#ready" blocking="render">
  <script>
    // Follows the system by default; apply a chosen theme before first paint
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (theme !== 'light' && theme !== 'dark') return;
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        var color = theme === 'dark' ? '#121211' : '#f3f2ee';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = color; });
      } catch (e) {}
    })();
  </script>
</head>
<body class="{{body_class}}">
  <div class="wrap">
    <header class="masthead">
      <a href="{{base_path}}/" class="brand">ozdamar<span class="brand__dot" aria-hidden="true"></span></a>
      <nav class="nav" aria-label="Primary">
        {{nav_links}}
      </nav>
    </header>

    <main>
      {{content}}
    </main>

    <footer class="colophon">
      <span>© {{current_year}} · Ex nihilo aliquid</span>
      <div class="colophon__links">
        <nav class="colophon__links" aria-label="Elsewhere">
          <a href="https://github.com/yi00it">GitHub</a>
          <a href="https://x.com/yi00it">X</a>
          <a href="{{base_path}}/feed.xml">RSS</a>
        </nav>
        <div class="segmented segmented--sm" role="radiogroup" aria-label="Appearance" data-theme-switch hidden>
          <button type="button" role="radio" aria-checked="true" data-value="auto">Auto</button>
          <button type="button" role="radio" aria-checked="false" data-value="light" tabindex="-1">Light</button>
          <button type="button" role="radio" aria-checked="false" data-value="dark" tabindex="-1">Dark</button>
        </div>
      </div>
    </footer>
  </div>

  <script src="{{base_path}}/assets/site.js"></script>
  <div id="ready" hidden></div>
</body>
</html>
