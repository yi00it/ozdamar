<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}}</title>
  <meta name="description" content="{{page_description}}">
  <link rel="canonical" href="{{page_url}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site_name}}">
  <meta property="og:title" content="{{page_title}}">
  <meta property="og:description" content="{{page_description}}">
  <meta property="og:url" content="{{page_url}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@yi00it">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f3f2ee">
  <link rel="icon" href="{{base_path}}/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap">
  <link rel="stylesheet" href="{{base_path}}/assets/main.css">
  <link rel="alternate" type="application/rss+xml" title="{{site_name}}" href="{{base_path}}/feed.xml">
  <script>
    // Light by default; apply a saved choice before first paint
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body class="{{body_class}}">
  <div class="wrap">
    <header class="masthead">
      <a href="{{base_path}}/" class="brand">ozdamar<span class="brand__dot" aria-hidden="true"></span></a>
      <nav class="nav" aria-label="Primary">
        {{nav_links}}
      </nav>
    </header>

    <main>
      {{content}}
    </main>

    <footer class="colophon">
      <span>© {{current_year}} - Ex nihilo aliquid</span>
      <nav class="colophon__links" aria-label="Elsewhere">
        <a href="https://github.com/yi00it">GitHub</a>
        <a href="https://x.com/yi00it">X</a>
        <a href="{{base_path}}/feed.xml">RSS</a>
        <button class="colophon__theme" type="button" data-theme-toggle aria-pressed="false">Dark mode</button>
      </nav>
    </footer>
  </div>

  <script src="{{base_path}}/assets/site.js" defer></script>
</body>
</html>
