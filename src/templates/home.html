<div class="home">
  <h1 class="hero">{{intro}}</h1>
  <p class="hero__sub">{{intro_sub}}</p>

  <div class="home__grid">
    <section aria-labelledby="projects">
      <h2 class="label" id="projects">Projects</h2>
      <ul class="mini">
        {{projects_list}}
      </ul>
      <a href="{{base_path}}/projects/" class="more">All projects <span aria-hidden="true">→</span></a>
    </section>

    <section aria-labelledby="writing">
      <h2 class="label" id="writing">Writing</h2>
      <ul class="mini">
        {{posts_list}}
      </ul>
      <a href="{{base_path}}/blog/" class="more">All writing <span aria-hidden="true">→</span></a>
    </section>
  </div>
</div>
